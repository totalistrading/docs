<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" role="img" aria-labelledby="channels-title" width="880" height="292">
  <style>
    .dg-node { fill: rgba(255, 255, 255, 0.045); stroke: rgba(255, 255, 255, 0.24); stroke-width: 1; }
    .dg-node-accent { fill: rgba(7, 201, 131, 0.14); stroke: rgba(7, 201, 131, 0.5); stroke-width: 1; }
    .dg-node-warn { fill: rgba(251, 191, 36, 0.14); stroke: rgba(251, 191, 36, 0.45); stroke-width: 1; }
    .dg-group { fill: none; stroke: rgba(255, 255, 255, 0.13); stroke-width: 1; stroke-dasharray: 4 4; }
    .dg-line { stroke: rgba(255, 255, 255, 0.24); stroke-width: 1.25; fill: none; }
    .dg-line-accent { stroke: #07c983; stroke-width: 1.5; fill: none; }
    .dg-line-dashed { stroke: rgba(255, 255, 255, 0.24); stroke-width: 1.25; stroke-dasharray: 5 4; fill: none; }
    .dg-line-warn { stroke: #fbbf24; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .dg-t { fill: #e6edf3; font-size: 13px; font-weight: 600; }
    .dg-t-sm { fill: #e6edf3; font-size: 11.5px; font-weight: 500; }
    .dg-t-dim { fill: #94a3b8; font-size: 11.5px; font-weight: 500; }
    .dg-t-mono { fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 11.5px; font-weight: 500; }
    .dg-t-mono-dim { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 11px; font-weight: 500; }
    .dg-t-accent { fill: #07c983; font-size: 11.5px; font-weight: 600; }
    .dg-t-warn { fill: #fbbf24; font-size: 11.5px; font-weight: 600; }
    .dg-t-label { fill: #94a3b8; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .dg-arrow { fill: rgba(255, 255, 255, 0.24); }
    .dg-arrow-accent { fill: #07c983; }
    .dg-arrow-warn { fill: #fbbf24; }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <title id="channels-title">Which channel covers which phase of a trade</title>
  <path d="M 136 58 L 856 58" class="dg-line" />
  <path d="M 136 51 L 136 65" class="dg-line" />
  <path d="M 420 51 L 420 65" class="dg-line" />
  <path d="M 850 51 L 850 65" class="dg-line" />
  <text x="136" y="42" class="dg-t-dim">create request</text>
  <text x="420" y="42" class="dg-t-accent" text-anchor="middle">you commit</text>
  <text x="850" y="42" class="dg-t-dim" text-anchor="end">settled</text>
  <path d="M 420 66 L 420 272" class="dg-line-dashed" />
  <text x="16" y="94" class="dg-t">SSE</text>
  <text x="16" y="111" class="dg-t-dim">pre-trade</text>
  <rect x="136" y="76" width="278" height="44" rx="8" class="dg-node-accent" />
  <text x="152" y="103" class="dg-t-mono">best_quote, live pricing</text>
  <text x="16" y="144" class="dg-t">WebSocket</text>
  <text x="16" y="161" class="dg-t-dim">live only</text>
  <rect x="426" y="126" width="424" height="44" rx="8" class="dg-node" />
  <text x="442" y="153" class="dg-t-mono">quote:accepted ... position:settled</text>
  <text x="16" y="194" class="dg-t">Webhooks</text>
  <text x="16" y="211" class="dg-t-dim">durable</text>
  <rect x="426" y="176" width="424" height="44" rx="8" class="dg-node" />
  <text x="442" y="203" class="dg-t-mono">position.settled, signed and retried</text>
  <text x="16" y="244" class="dg-t">REST</text>
  <text x="16" y="261" class="dg-t-dim">on demand</text>
  <rect x="136" y="226" width="714" height="44" rx="8" class="dg-node" />
  <text x="152" y="253" class="dg-t-mono">portfolio, parlays, P&amp;L, balances, any time</text>
</svg>
