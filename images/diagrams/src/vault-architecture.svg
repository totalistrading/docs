<svg viewBox="0 0 880 300" role="img" aria-labelledby="vault-title">
  <title id="vault-title">How USDC moves between wallets, vaults, a position, and the fee vault</title>
  <defs>
    <marker id="vt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrow" />
    </marker>
    <marker id="vt-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrow-accent" />
    </marker>
  </defs>
  <rect x="200" y="30" width="440" height="250" rx="10" class="dg-group" />
  <text x="210" y="22" class="dg-t-label">ON CHAIN, SOLANA</text>
  <rect x="24" y="60" width="150" height="52" rx="8" class="dg-node" />
  <text x="99" y="91" class="dg-t" text-anchor="middle">Your wallet</text>
  <rect x="230" y="60" width="150" height="52" rx="8" class="dg-node-accent" />
  <text x="305" y="91" class="dg-t" text-anchor="middle">Your vault</text>
  <rect x="24" y="200" width="150" height="52" rx="8" class="dg-node" />
  <text x="99" y="231" class="dg-t" text-anchor="middle">Maker wallet</text>
  <rect x="230" y="200" width="150" height="52" rx="8" class="dg-node" />
  <text x="305" y="231" class="dg-t" text-anchor="middle">Maker vault</text>
  <rect x="440" y="102" width="180" height="108" rx="8" class="dg-node-accent" />
  <text x="530" y="134" class="dg-t" text-anchor="middle">Position</text>
  <text x="530" y="158" class="dg-t-mono-dim" text-anchor="middle">locks user_stake</text>
  <text x="530" y="178" class="dg-t-mono-dim" text-anchor="middle">and mm_risk</text>
  <rect x="680" y="60" width="176" height="52" rx="8" class="dg-node" />
  <text x="768" y="91" class="dg-t" text-anchor="middle">Fee vault</text>
  <rect x="680" y="200" width="176" height="52" rx="8" class="dg-node" />
  <text x="768" y="224" class="dg-t" text-anchor="middle">Totalis settlement</text>
  <text x="768" y="242" class="dg-t-dim" text-anchor="middle">Kalshi and Polymarket outcomes</text>
  <path d="M 178 78 L 226 78" class="dg-line" marker-end="url(#vt-a)" />
  <path d="M 230 96 L 182 96" class="dg-line" marker-end="url(#vt-a)" />
  <text x="202" y="126" class="dg-t-dim" text-anchor="middle">USDC in, payout out</text>
  <path d="M 178 218 L 226 218" class="dg-line" marker-end="url(#vt-a)" />
  <path d="M 230 236 L 182 236" class="dg-line" marker-end="url(#vt-a)" />
  <path d="M 384 86 L 410 86 L 410 140 L 434 140" class="dg-line-accent" marker-end="url(#vt-b)" />
  <text x="412" y="76" class="dg-t-accent">stake</text>
  <path d="M 384 226 L 410 226 L 410 176 L 434 176" class="dg-line" marker-end="url(#vt-a)" />
  <text x="412" y="246" class="dg-t-dim">collateral</text>
  <path d="M 624 130 L 676 92" class="dg-line-accent" marker-end="url(#vt-b)" />
  <text x="662" y="128" class="dg-t-accent" text-anchor="end">1% of profit</text>
  <path d="M 676 216 L 626 190" class="dg-line-dashed" marker-end="url(#vt-a)" />
  <text x="662" y="198" class="dg-t-dim" text-anchor="end">settles</text>
</svg>
