<svg viewBox="0 0 880 260" role="img" aria-labelledby="feeflow-title">
  <title id="feeflow-title">Fee waterfall for a 25 USDC bet at 4.0 payout odds</title>
  <defs>
    <marker id="fw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrow" />
    </marker>
  </defs>
  <rect x="16" y="30" width="180" height="60" rx="8" class="dg-node" />
  <text x="106" y="53" class="dg-t-dim" text-anchor="middle">Bet amount</text>
  <text x="106" y="76" class="dg-t" text-anchor="middle">25.00 USDC</text>
  <path d="M 200 60 L 270 60" class="dg-line" marker-end="url(#fw-a)" />
  <text x="235" y="48" class="dg-t-warn" text-anchor="middle">1% taker fee</text>
  <rect x="276" y="30" width="180" height="60" rx="8" class="dg-node-accent" />
  <text x="366" y="53" class="dg-t-dim" text-anchor="middle">Net stake</text>
  <text x="366" y="76" class="dg-t" text-anchor="middle">24.75 USDC</text>
  <path d="M 460 60 L 530 60" class="dg-line" marker-end="url(#fw-a)" />
  <text x="495" y="48" class="dg-t-accent" text-anchor="middle">x 4.0 odds</text>
  <rect x="536" y="30" width="180" height="60" rx="8" class="dg-node" />
  <text x="626" y="53" class="dg-t-dim" text-anchor="middle">Total payout</text>
  <text x="626" y="76" class="dg-t" text-anchor="middle">99.00 USDC</text>
  <text x="736" y="55" class="dg-t-dim">Maker locks</text>
  <text x="736" y="76" class="dg-t">74.25 USDC</text>
  <path d="M 626 94 L 626 118" class="dg-line" />
  <path d="M 626 118 L 226 118 L 226 146" class="dg-line" marker-end="url(#fw-a)" />
  <path d="M 626 118 L 656 118 L 656 146" class="dg-line" marker-end="url(#fw-a)" />
  <rect x="16" y="150" width="420" height="88" rx="8" class="dg-node-accent" />
  <text x="36" y="178" class="dg-t">Every leg wins</text>
  <text x="36" y="203" class="dg-t-sm">You receive 99.00 minus a 1% fee on the 74.25 profit</text>
  <text x="36" y="226" class="dg-t-mono">98.2575 USDC</text>
  <rect x="460" y="150" width="404" height="88" rx="8" class="dg-node" />
  <text x="480" y="178" class="dg-t">Any leg loses</text>
  <text x="480" y="203" class="dg-t-sm">The maker keeps your 24.75 stake minus a 1% fee on it</text>
  <text x="480" y="226" class="dg-t-mono">0 USDC</text>
</svg>
