  <path d="M 384 312 L 408 312 L 408 206 L 424 206" class="dg-line" marker-end="url(#vt-a)" />
  <path d="M 524 96 L 524 130" class="dg-line-dashed" marker-end="url(#vt-a)" />
  <text x="534" y="118" class="dg-t-dim">fee rate fixed here</text>
  <path d="M 524 240 L 524 286" class="dg-line-accent" marker-end="url(#vt-b)" />
  <text x="534" y="268" class="dg-t-accent">1% of profit</text>
  <path d="M 676 186 L 622 186" class="dg-line" marker-end="url(#vt-a)" />
  <path d="M 762 226 L 762 266" class="dg-line-dashed" marker-end="url(#vt-a)" />
</svg>
