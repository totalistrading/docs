  <text x="524" y="82" class="dg-t-dim" text-anchor="middle">roles, fee rate</text>
  <rect x="432" y="136" width="184" height="100" rx="8" class="dg-node-accent" />
  <text x="524" y="164" class="dg-t" text-anchor="middle">Position PDA</text>
