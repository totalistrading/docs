  <text x="524" y="203" class="dg-t-mono-dim" text-anchor="middle">+ mm_risk</text>
  <text x="524" y="223" class="dg-t-dim" text-anchor="middle">legs, status, fee rate</text>
  <rect x="432" y="292" width="184" height="56" rx="8" class="dg-node" />
  <text x="524" y="314" class="dg-t" text-anchor="middle">Fee vault</text>
  <text x="524" y="333" class="dg-t-dim" text-anchor="middle">protocol revenue</text>
  <rect x="24" y="292" width="152" height="56" rx="8" class="dg-node" />
  <text x="100" y="314" class="dg-t" text-anchor="middle">Maker wallet</text>
  <text x="100" y="333" class="dg-t-dim" text-anchor="middle">Privy TEE</text>
  <rect x="228" y="292" width="152" height="56" rx="8" class="dg-node" />
  <text x="304" y="314" class="dg-t" text-anchor="middle">Maker vault PDA</text>
  <text x="304" y="333" class="dg-t-dim" text-anchor="middle">holds USDC</text>
  <rect x="680" y="150" width="164" height="72" rx="8" class="dg-node" />
  <text x="762" y="174" class="dg-t" text-anchor="middle">Totalis settlement</text>
  <text x="762" y="193" class="dg-t-dim" text-anchor="middle">creates positions,</text>
  <text x="762" y="210" class="dg-t-dim" text-anchor="middle">submits outcomes</text>
  <rect x="680" y="272" width="164" height="64" rx="8" class="dg-node" />
  <text x="762" y="296" class="dg-t" text-anchor="middle">Kalshi, Polymarket</text>
  <text x="762" y="315" class="dg-t-dim" text-anchor="middle">resolution source</text>
  <path d="M 180 74 L 220 74" class="dg-line" marker-end="url(#vt-a)" />
  <text x="200" y="66" class="dg-t-dim" text-anchor="middle">USDC</text>
  <path d="M 228 98 L 184 98" class="dg-line" marker-end="url(#vt-a)" />
  <text x="200" y="114" class="dg-t-dim" text-anchor="middle">payout</text>
  <path d="M 180 310 L 220 310" class="dg-line" marker-end="url(#vt-a)" />
  <text x="200" y="302" class="dg-t-dim" text-anchor="middle">USDC</text>
  <path d="M 228 334 L 184 334" class="dg-line" marker-end="url(#vt-a)" />
