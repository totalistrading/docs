<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-labelledby="webhooks-title" width="880" height="330">
  <style>
    .dg-node { fill: rgba(255, 255, 255, 0.045); stroke: rgba(255, 255, 255, 0.24); stroke-width: 1; }
    .dg-node-accent { fill: rgba(7, 201, 131, 0.14); stroke: rgba(7, 201, 131, 0.5); stroke-width: 1; }
    .dg-node-warn { fill: rgba(251, 191, 36, 0.14); stroke: rgba(251, 191, 36, 0.45); stroke-width: 1; }
    .dg-group { fill: none; stroke: rgba(255, 255, 255, 0.13); stroke-width: 1; stroke-dasharray: 4 4; }
    .dg-line { stroke: rgba(255, 255, 255, 0.24); stroke-width: 1.25; fill: none; }
    .dg-line-accent { stroke: #07c983; stroke-width: 1.5; fill: none; }
    .dg-line-dashed { stroke: rgba(255, 255, 255, 0.24); stroke-width: 1.25; stroke-dasharray: 5 4; fill: none; }
    .dg-line-warn { stroke: #fbbf24; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .dg-t { fill: #e6edf3; font-size: 13px; font-weight: 600; }
    .dg-t-sm { fill: #e6edf3; font-size: 11.5px; font-weight: 500; }
    .dg-t-dim { fill: #94a3b8; font-size: 11.5px; font-weight: 500; }
    .dg-t-mono { fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 11.5px; font-weight: 500; }
    .dg-t-mono-dim { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 11px; font-weight: 500; }
    .dg-t-accent { fill: #07c983; font-size: 11.5px; font-weight: 600; }
    .dg-t-warn { fill: #fbbf24; font-size: 11.5px; font-weight: 600; }
    .dg-t-label { fill: #94a3b8; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .dg-arrow { fill: rgba(255, 255, 255, 0.24); }
    .dg-arrow-accent { fill: #07c983; }
    .dg-arrow-warn { fill: #fbbf24; }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <title id="webhooks-title">How a webhook delivery is signed, delivered, retried, dead-lettered, and replayed</title>
  <defs>
    <marker id="wh-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrow" />
    </marker>
    <marker id="wh-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrow-accent" />
    </marker>
    <marker id="wh-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrow-warn" />
    </marker>
  </defs>
  <text x="40" y="34" class="dg-t-label">TOTALIS</text>
  <text x="562" y="34" class="dg-t-label">YOU</text>
  <rect x="40" y="50" width="180" height="76" rx="8" class="dg-node" />
  <text x="130" y="80" class="dg-t" text-anchor="middle">Event occurs</text>
  <text x="130" y="102" class="dg-t-mono-dim" text-anchor="middle">position.settled</text>
  <path d="M 220 88 L 258 88" class="dg-line" marker-end="url(#wh-a)" />
  <rect x="262" y="50" width="220" height="76" rx="8" class="dg-node-accent" />
  <text x="372" y="80" class="dg-t" text-anchor="middle">Sign and queue</text>
  <text x="372" y="102" class="dg-t-mono-dim" text-anchor="middle">signed, unique event id</text>
  <path d="M 482 88 L 558 88" class="dg-line" marker-end="url(#wh-a)" />
  <text x="520" y="78" class="dg-t-dim" text-anchor="middle">POST</text>
  <rect x="562" y="50" width="278" height="76" rx="8" class="dg-node" />
  <text x="701" y="94" class="dg-t" text-anchor="middle">Your endpoint</text>
  <path d="M 701 126 L 701 160" class="dg-line" />
  <path d="M 140 160 L 740 160" class="dg-line" />
  <path d="M 140 160 L 140 192" class="dg-line-accent" marker-end="url(#wh-g)" />
  <path d="M 440 160 L 440 192" class="dg-line-warn" marker-end="url(#wh-w)" />
  <path d="M 740 160 L 740 192" class="dg-line" marker-end="url(#wh-a)" />
  <text x="150" y="182" class="dg-t-accent">2xx</text>
  <text x="450" y="182" class="dg-t-warn">5xx, 408, 429, timeout</text>
  <text x="750" y="182" class="dg-t-dim">other 4xx</text>
  <rect x="40" y="196" width="200" height="70" rx="8" class="dg-node-accent" />
  <text x="140" y="224" class="dg-t-mono" text-anchor="middle">delivered</text>
  <rect x="320" y="196" width="240" height="70" rx="8" class="dg-node-warn" />
  <text x="440" y="224" class="dg-t-mono" text-anchor="middle">failed</text>
  <text x="440" y="246" class="dg-t-dim" text-anchor="middle">retried with exponential backoff</text>
  <rect x="640" y="196" width="200" height="70" rx="8" class="dg-node" />
  <text x="740" y="224" class="dg-t-mono" text-anchor="middle">dead_letter</text>
  <path d="M 320 231 L 290 231 L 290 130" class="dg-line-warn" marker-end="url(#wh-w)" />
  <text x="284" y="180" class="dg-t-warn" text-anchor="end">retry</text>
  <path d="M 440 266 L 440 298 L 372 298 L 372 130" class="dg-line-dashed" marker-end="url(#wh-a)" />
  <path d="M 740 266 L 740 298 L 440 298" class="dg-line-dashed" />
  <path d="M 140 266 L 140 298 L 372 298" class="dg-line-dashed" />
  <text x="560" y="320" class="dg-t-dim" text-anchor="middle">redeliver: same event id, re-signed with the current secret</text>
</svg>
