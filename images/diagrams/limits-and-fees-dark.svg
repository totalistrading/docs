<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" role="img" aria-labelledby="feeflow-title" width="880" height="336">
  <style>
    .dg-node { fill: rgba(255, 255, 255, 0.045); stroke: rgba(255, 255, 255, 0.24); stroke-width: 1; }
    .dg-node-accent { fill: rgba(7, 201, 131, 0.14); stroke: rgba(7, 201, 131, 0.5); stroke-width: 1; }
    .dg-node-warn { fill: rgba(251, 191, 36, 0.14); stroke: rgba(251, 191, 36, 0.45); stroke-width: 1; }
    .dg-group { fill: none; stroke: rgba(255, 255, 255, 0.13); stroke-width: 1; stroke-dasharray: 4 4; }
    .dg-line { stroke: rgba(255, 255, 255, 0.24); stroke-width: 1.25; fill: none; }
    .dg-line-accent { stroke: #07c983; stroke-width: 1.5; fill: none; }
    .dg-line-dashed { stroke: rgba(255, 255, 255, 0.24); stroke-width: 1.25; stroke-dasharray: 5 4; fill: none; }
    .dg-line-warn { stroke: #fbbf24; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .dg-t { fill: #e6edf3; font-size: 13px; font-weight: 600; }
    .dg-t-sm { fill: #e6edf3; font-size: 11.5px; font-weight: 500; }
    .dg-t-dim { fill: #94a3b8; font-size: 11.5px; font-weight: 500; }
    .dg-t-mono { fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 11.5px; font-weight: 500; }
    .dg-t-mono-dim { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 11px; font-weight: 500; }
    .dg-t-accent { fill: #07c983; font-size: 11.5px; font-weight: 600; }
    .dg-t-warn { fill: #fbbf24; font-size: 11.5px; font-weight: 600; }
    .dg-t-label { fill: #94a3b8; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .dg-arrow { fill: rgba(255, 255, 255, 0.24); }
    .dg-arrow-accent { fill: #07c983; }
    .dg-arrow-warn { fill: #fbbf24; }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <title id="feeflow-title">Fee waterfall for a 25 USDC bet at 4.0 payout odds</title>
  <defs>
    <marker id="fw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrow" />
    </marker>
  </defs>
  <text x="16" y="20" class="dg-t-label">PRICING</text>
  <rect x="16" y="34" width="176" height="60" rx="8" class="dg-node" />
  <text x="104" y="57" class="dg-t-dim" text-anchor="middle">Bet amount</text>
  <text x="104" y="79" class="dg-t" text-anchor="middle">25.00 USDC</text>
  <path d="M 196 64 L 262 64" class="dg-line" marker-end="url(#fw-a)" />
  <text x="229" y="50" class="dg-t-warn" text-anchor="middle">-0.25</text>
  <text x="229" y="86" class="dg-t-dim" text-anchor="middle">1% taker</text>
  <rect x="268" y="34" width="176" height="60" rx="8" class="dg-node-accent" />
  <text x="356" y="57" class="dg-t-dim" text-anchor="middle">Net stake</text>
  <text x="356" y="79" class="dg-t-mono" text-anchor="middle">user_stake 24.75</text>
  <path d="M 448 64 L 514 64" class="dg-line" marker-end="url(#fw-a)" />
  <text x="481" y="50" class="dg-t-accent" text-anchor="middle">x 4.0</text>
  <text x="481" y="86" class="dg-t-dim" text-anchor="middle">odds</text>
  <rect x="520" y="34" width="176" height="60" rx="8" class="dg-node" />
  <text x="608" y="57" class="dg-t-dim" text-anchor="middle">Total payout</text>
  <text x="608" y="79" class="dg-t" text-anchor="middle">99.00 USDC</text>
  <text x="716" y="58" class="dg-t-dim">Maker locks</text>
  <text x="716" y="78" class="dg-t-mono-dim">mm_risk 74.25</text>
  <path d="M 608 98 L 608 122" class="dg-line" />
  <path d="M 608 122 L 232 122 L 232 152" class="dg-line" marker-end="url(#fw-a)" />
  <path d="M 608 122 L 668 122 L 668 152" class="dg-line" marker-end="url(#fw-a)" />
  <text x="16" y="146" class="dg-t-label">SETTLEMENT</text>
  <rect x="16" y="158" width="432" height="162" rx="8" class="dg-node-accent" />
  <text x="36" y="184" class="dg-t">Every leg wins</text>
  <text x="36" y="210" class="dg-t-sm">Your profit is the maker's locked risk.</text>
  <text x="36" y="240" class="dg-t-mono">profit      = 99.00 - 24.75 = 74.25</text>
  <text x="36" y="262" class="dg-t-mono">profit fee  = 1% of 74.25   =  0.7425</text>
  <text x="36" y="284" class="dg-t-mono">you receive = 99.00 - 0.7425</text>
  <text x="36" y="306" class="dg-t-mono">            = 98.2575 USDC</text>
  <rect x="472" y="158" width="392" height="162" rx="8" class="dg-node" />
  <text x="492" y="184" class="dg-t">Any leg loses</text>
  <text x="492" y="210" class="dg-t-sm">Your net stake transfers to the maker.</text>
  <text x="492" y="240" class="dg-t-mono">maker profit = 24.75</text>
  <text x="492" y="262" class="dg-t-mono">profit fee   = 1% of 24.75 = 0.2475</text>
  <text x="492" y="284" class="dg-t-mono">you receive  = 0</text>
  <text x="492" y="306" class="dg-t-mono-dim">the 0.25 taker fee is already spent</text>
</svg>
