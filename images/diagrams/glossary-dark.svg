<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="nouns-title" width="880" height="300">
  <style>
    .dg-node { fill: rgba(255, 255, 255, 0.045); stroke: rgba(255, 255, 255, 0.24); stroke-width: 1; }
    .dg-node-accent { fill: rgba(7, 201, 131, 0.14); stroke: rgba(7, 201, 131, 0.5); stroke-width: 1; }
    .dg-node-warn { fill: rgba(251, 191, 36, 0.14); stroke: rgba(251, 191, 36, 0.45); stroke-width: 1; }
    .dg-group { fill: none; stroke: rgba(255, 255, 255, 0.13); stroke-width: 1; stroke-dasharray: 4 4; }
    .dg-line { stroke: rgba(255, 255, 255, 0.24); stroke-width: 1.25; fill: none; }
    .dg-line-accent { stroke: #07c983; stroke-width: 1.5; fill: none; }
    .dg-line-dashed { stroke: rgba(255, 255, 255, 0.24); stroke-width: 1.25; stroke-dasharray: 5 4; fill: none; }
    .dg-line-warn { stroke: #fbbf24; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .dg-t { fill: #e6edf3; font-size: 13px; font-weight: 600; }
    .dg-t-sm { fill: #e6edf3; font-size: 11.5px; font-weight: 500; }
    .dg-t-dim { fill: #94a3b8; font-size: 11.5px; font-weight: 500; }
    .dg-t-mono { fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 11.5px; font-weight: 500; }
    .dg-t-mono-dim { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 11px; font-weight: 500; }
    .dg-t-accent { fill: #07c983; font-size: 11.5px; font-weight: 600; }
    .dg-t-warn { fill: #fbbf24; font-size: 11.5px; font-weight: 600; }
    .dg-t-label { fill: #94a3b8; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .dg-arrow { fill: rgba(255, 255, 255, 0.24); }
    .dg-arrow-accent { fill: #07c983; }
    .dg-arrow-warn { fill: #fbbf24; }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <title id="nouns-title">Which name applies at each stage of a trade</title>
  <text x="16" y="22" class="dg-t-label">LIFECYCLE</text>
  <path d="M 40 62 L 856 62" class="dg-line" />
  <path d="M 60 55 L 60 69" class="dg-line" />
  <path d="M 180 55 L 180 69" class="dg-line" />
  <path d="M 380 55 L 380 69" class="dg-line" />
  <path d="M 500 55 L 500 69" class="dg-line" />
  <path d="M 620 55 L 620 69" class="dg-line" />
  <path d="M 800 55 L 800 69" class="dg-line" />
  <text x="60" y="86" class="dg-t-mono-dim" text-anchor="middle">open</text>
  <text x="180" y="86" class="dg-t-mono-dim" text-anchor="middle">quoted</text>
  <text x="380" y="86" class="dg-t-mono-dim" text-anchor="middle">accepted</text>
  <text x="500" y="86" class="dg-t-mono-dim" text-anchor="middle">confirmed</text>
  <text x="620" y="86" class="dg-t-mono-dim" text-anchor="middle">executed</text>
  <text x="800" y="86" class="dg-t-mono-dim" text-anchor="middle">settled</text>
  <path d="M 380 36 L 380 272" class="dg-line-dashed" />
  <text x="388" y="34" class="dg-t-accent">you commit</text>
  <rect x="46" y="104" width="330" height="46" rx="8" class="dg-node" />
  <text x="64" y="124" class="dg-t">quote request</text>
  <text x="64" y="141" class="dg-t-mono-dim">ephemeral. no historical record after it ends</text>
  <rect x="384" y="158" width="472" height="46" rx="8" class="dg-node-accent" />
  <text x="402" y="178" class="dg-t">RFQ, product name: parlay</text>
  <text x="402" y="195" class="dg-t-mono-dim">GET /v1/rfqs/{id}. this is the queryable object</text>
  <rect x="504" y="212" width="352" height="46" rx="8" class="dg-node" />
  <text x="522" y="232" class="dg-t">position</text>
  <text x="522" y="249" class="dg-t-mono-dim">on-chain footprint. cashout eligible at executed</text>
</svg>
